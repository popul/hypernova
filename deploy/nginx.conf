# HYPERNOVA — service statique, nginx non-root en 8080, avec les règles de cache
# dont la PWA dépend :
# - sw.js jamais mis en cache HTTP (sinon une mise à jour du jeu n'atteint jamais les clients) ;
# - assets hashés par Vite immuables un an ;
# - navigations revalidées pour attraper chaque nouveau build.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/manifest+json image/svg+xml;

    # L'extension .webmanifest est absente de la table MIME par défaut de nginx.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Le service worker ne doit jamais être servi depuis un cache périmé.
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Bundles hashés par Vite : immuables.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Icônes PWA : stables mais pas hashées — cache modéré.
    location /icons/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
